[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuruh-canary-evaluation-ledger"
version = "0.1.1a0"
description = "Tamper-evident canary evaluation ledger with deterministic PASS/HOLD/ROLLBACK evidence."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jeramie Hicks / Neuruh"}]

[project.scripts]
neuruh-canary-evaluation-ledger="neuruh_canary_evaluation_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/NeuruhAI/neuruh-canary-evaluation-ledger"
Repository = "https://github.com/NeuruhAI/neuruh-canary-evaluation-ledger"

[tool.setuptools.packages.find]
where = ["src"]
